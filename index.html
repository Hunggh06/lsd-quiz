<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hệ Thống Ôn Tập Môn Học — Đại Học Công Nghiệp Hà Nội</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-subject="lsd">
<header class="top-header">
  <div class="top-header-inner">
    <div class="site-logo">
      <span class="logo-badge">HAUI</span>
      <span class="logo-title">Ôn Thi Đại Cương &amp; Chuyên Ngành</span>
    </div>
    <div class="subject-switcher">
      <button id="btnSubjectLSD" class="subject-btn active" title="Ôn tập Lịch sử Đảng">
        <span class="sb-icon">🏛️</span>
        <div class="sb-info">
          <strong>Lịch sử Đảng</strong>
          <span>Trắc nghiệm &amp; Tự luận</span>
        </div>
      </button>
      <button id="btnSubjectPLDC" class="subject-btn" title="Ôn tập Pháp luật đại cương">
        <span class="sb-icon">⚖️</span>
        <div class="sb-info">
          <strong>Pháp luật đại cương</strong>
          <span>4 Dạng bài &amp; Chia thừa kế</span>
        </div>
      </button>
    </div>
  </div>
</header>

<div id="app">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="brand">
      <div id="brandMark" class="brand-mark">ĐCSVN</div>
      <div class="brand-text">
        <strong id="brandTitle">Lịch sử Đảng</strong>
        <span id="brandSub">Trắc nghiệm &amp; Tự luận</span>
      </div>
    </div>
    <div id="sidebarModeTabs" class="sidebar-mode-tabs">
      <button id="tabTracNghiem" class="mode-tab active">🎯 Trắc nghiệm</button>
      <button id="tabTuLuan" class="mode-tab">📝 Tự luận (8 câu)</button>
    </div>
    <div class="essay-nav-wrap" style="display:none">
      <button id="btnEssayNav" class="essay-nav-btn">
        <span class="enb-icon">📝</span>
        <div class="enb-text">
          <span class="enb-title">Ôn thi Tự Luận</span>
          <span class="enb-sub">8 câu trọng tâm Kỳ II</span>
        </div>
        <span class="enb-badge">HOT</span>
      </button>
    </div>
    <nav id="tree" class="tree"></nav>
    <div id="rankBig" class="rank-big"></div>
    <div class="side-foot">
      <div id="playerName" class="player-name"></div>
      <button id="btnDashboard" class="ghost-btn">📊 Thống kê</button>
      <button id="btnLeaderboard" class="ghost-btn">🏆 Xếp hạng</button>
      <button id="btnResetAll" class="ghost-btn danger">🗑 Xóa tiến độ</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main">
    <button id="btnMenu" class="ghost-btn mobile-only mobile-menu-fab">☰ Danh mục</button>

    <section id="content" class="content">
      <div id="welcome" class="welcome">
      </div>
    </section>
  </main>

  <!-- QUESTION NAVIGATOR -->
  <aside id="qnav" class="qnav hidden">
    <div class="qnav-head">
      <div class="qnav-title" id="qnavTitle">Bảng câu hỏi</div>
      <div id="lessonProgress" class="qnav-progress"></div>
    </div>
    <div id="qnavGrid" class="qnav-grid"></div>
  </aside>
</div>

<!-- DASHBOARD MODAL -->
<div id="dashModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2>📊 Thống kê kết quả</h2>
      <button id="btnDashClose" class="ghost-btn">✕</button>
    </div>
    <div id="dashBody" class="dash-body"></div>
  </div>
</div>

<div id="rankModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2>🏆 Các mốc rank</h2>
      <button id="btnRankClose" class="ghost-btn">✕</button>
    </div>
    <div id="rankBody" class="rank-body"></div>
  </div>
</div>

<div id="nameModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2>👋 Nhập tên của bạn</h2>
    </div>
    <div class="name-body">
      <p>Nhập tên để lưu điểm lên bảng xếp hạng chung của mọi người.</p>
      <input id="nameInput" type="text" maxlength="24" placeholder="Tên của bạn" autocomplete="off" />
      <button id="btnNameOk" class="ghost-btn">Xác nhận</button>
    </div>
  </div>
</div>

<div id="leaderboardModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2>🏆 Bảng xếp hạng</h2>
      <button id="btnLbClose" class="ghost-btn">✕</button>
    </div>
    <div class="lb-subject-tabs">
      <button id="btnLbLsd" class="lb-tab active">🏛️ Lịch sử Đảng</button>
      <button id="btnLbPldc" class="lb-tab">⚖️ Pháp luật đại cương</button>
    </div>
    <div id="lbBody" class="lb-body"></div>
  </div>
</div>

<div id="comboBadge" class="combo-badge"></div>
<div id="rankUpFx" class="rankup-fx"></div>

<script src="data.js"></script>
<script src="essay-data.js"></script>
<script src="data-pldc.js"></script>
<script src="app.js"></script>
</body>
</html>
